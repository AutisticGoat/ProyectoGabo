<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña | HabitFlow</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<main class="login-container">

    <!-- PASO 1: Solicitar código -->
    <div id="paso-1">
        <h1>Recuperar contraseña</h1>
        <p class="login-subtitle">Ingresa tu correo y te enviaremos un código de verificación.</p>

        <form id="form-paso1" novalidate>
            <div class="field">
                <label for="correo-recuperar">Correo electrónico</label>
                <input type="email" id="correo-recuperar" name="correo"
                       placeholder="tu@correo.com" required autocomplete="email">
                <small class="error"></small>
            </div>

            <button type="submit" id="btn-enviar">Enviar código</button>
            <p class="error global-error" id="error-paso1"></p>
            <p class="success-msg" id="exito-paso1"></p>
        </form>

        <div class="login-links">
            <a href="login.html">← Volver al inicio de sesión</a>
        </div>
    </div>

    <!-- PASO 2: Ingresar código + nueva contraseña -->
    <div id="paso-2" style="display:none;">
        <h1>Verificar código</h1>
        <p class="login-subtitle" id="subtitulo-paso2">Ingresa el código que enviamos a tu correo.</p>

        <form id="form-paso2" novalidate>
            <div class="field">
                <label for="codigo">Código de 6 dígitos</label>
                <input type="text" id="codigo" name="codigo"
                       placeholder="000000" maxlength="6"
                       inputmode="numeric" autocomplete="one-time-code" required>
                <small class="error"></small>
            </div>

            <div class="field">
                <label for="nueva-password">Nueva contraseña</label>
                <input type="password" id="nueva-password" name="nueva_password"
                       placeholder="Mínimo 8 caracteres" required>
                <small class="error"></small>
            </div>

            <div class="field">
                <label for="confirmar-password">Confirmar contraseña</label>
                <input type="password" id="confirmar-password"
                       placeholder="Repite la contraseña" required>
                <small class="error"></small>
            </div>

            <button type="submit" id="btn-restablecer">Cambiar contraseña</button>
            <p class="error global-error" id="error-paso2"></p>
            <p class="success-msg" id="exito-paso2"></p>
        </form>

        <div class="login-links">
            <a href="#" id="btn-otro-correo">← Usar otro correo</a>
        </div>
    </div>

</main>

<script src="js/recoverPassword.js"></script>
</body>
</html>
