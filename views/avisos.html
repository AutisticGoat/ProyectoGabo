<section class="card">
    <h2>Avisos</h2>
    <div id="lista-avisos"></div>
</section>

<section class="card card-temporizador">
    <h2>Recordatorio temporal</h2>
    <p class="subtitle">Notificarme algo dentro de unos minutos</p>
    <form id="form-temporizador" class="form-temporizador">
        <label>
            Mensaje
            <input type="text" id="aviso-mensaje" placeholder="Ej: Revisar el correo" required>
        </label>
        <label>
            En cuántos minutos
            <input type="number" id="aviso-minutos" min="1" max="1440" value="30" placeholder="30">
        </label>
        <button type="submit">Programar recordatorio</button>
    </form>
</section>
