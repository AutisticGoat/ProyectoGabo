<!-- ── Resumen del día ───────────────────────────────── -->
<section class="card">
    <h2>Resumen de hoy</h2>
    <p id="resumen-hoy">Has completado <strong>0 de 0</strong> hábitos hoy.</p>
</section>

<!-- ── Lista de rutinas ─────────────────────────────── -->
<section class="card">
    <div class="rutinas-header">
        <h2>Mis rutinas</h2>
        <div class="rutinas-filtros">
            <button type="button" class="btn-filtro active" data-filtro="activa">Activas</button>
            <button type="button" class="btn-filtro" data-filtro="pausada">Pausadas</button>
            <button type="button" class="btn-filtro" data-filtro="todas">Todas</button>
        </div>
    </div>

    <label class="toggle-completados" style="margin-bottom:.75rem; display:flex; align-items:center; gap:.5rem;">
        <input type="checkbox" id="ocultar-completados">
        Ocultar hábitos ya completados hoy
    </label>

    <div id="lista-rutinas"></div>
</section>

<!-- ── Nueva rutina ─────────────────────────────────── -->
<section class="card card-nueva-rutina">
    <h2>Nueva rutina</h2>
    <label>Nombre de la rutina
        <input type="text" id="nueva-rutina-nombre" placeholder="Ej: Mañanas productivas">
    </label>
    <label>Primer hábito (opcional)
        <input type="text" id="nuevo-habito-nombre" placeholder="Ej: Beber agua">
    </label>
    <label>Frecuencia
        <select id="nueva-rutina-frecuencia">
            <option value="diaria">Diaria</option>
            <option value="semanal">Semanal</option>
            <option value="mensual">Mensual</option>
        </select>
    </label>
    <button type="button" id="btn-crear-rutina">Crear rutina</button>
</section>

<!-- ── Temporizador de enfoque ──────────────────────── -->
<section class="card" id="timer-setup-rutinas">
    <h2>Temporizador de enfoque</h2>
    <div class="timer-presets">
        <span class="timer-preset-label">Presets:</span>
        <button type="button" class="btn-preset" data-mins="5">5 min</button>
        <button type="button" class="btn-preset active" data-mins="25">25 min</button>
        <button type="button" class="btn-preset" data-mins="50">50 min</button>
    </div>
    <label>Etiqueta (opcional)
        <input type="text" id="rutina-timer-label" placeholder="Ej: Lectura">
    </label>
    <label>Minutos
        <input type="number" id="rutina-timer-minutos" value="25" min="1" max="180">
    </label>
    <button type="button" id="btn-iniciar-rutina-timer">Iniciar temporizador</button>
</section>

<section class="card timer-display" id="timer-display-rutinas" style="display:none;">
    <div class="timer-ring-wrap">
        <svg class="timer-ring" viewBox="0 0 80 80">
            <circle class="timer-ring__track" cx="40" cy="40" r="34"/>
            <circle class="timer-ring__fill" id="timer-ring-fill-rutinas" cx="40" cy="40" r="34"/>
        </svg>
        <span class="timer-digits" id="timer-digits-rutinas">--:--</span>
    </div>
    <p class="timer-label" id="timer-label-rutinas"></p>
    <div class="timer-actions">
        <button type="button" id="btn-timer-pause-rutinas">Pausar</button>
        <button type="button" id="btn-timer-cancel-rutinas" class="btn-timer-cancel">Cancelar</button>
    </div>
</section>
