<section class="card">
    <h2>Gestión de usuarios</h2>
    <p class="subtitle">Busca, activa/desactiva, cambia rol o elimina cuentas.</p>

    <div class="search-bar">
        <input type="text" id="buscar-usuario"
               placeholder="Buscar por nombre o correo…"
               autocomplete="off">
        <button type="button" id="btn-buscar">Buscar</button>
        <button type="button" id="btn-ver-todos" class="btn-neutral">Ver todos</button>
    </div>

    <div class="table-wrapper">
        <table class="tabla-usuarios" id="tabla-usuarios">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Estado</th>
                    <th>Rol</th>
                    <th>Registro</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpo-usuarios">
                <tr><td colspan="7" style="text-align:center;color:var(--color-text-muted);">Cargando…</td></tr>
            </tbody>
        </table>
    </div>
</section>
